[package]
name = "utils"
version = "0.1.0"
authors = ["Amazon Firecracker team <firecracker-devel@amazon.com>"]
edition = "2021"
license = "Apache-2.0"

[lib]
bench = false

[dependencies]
derive_more = { version = "2.0.1", default-features = false, features = ["from"] }
displaydoc = "0.2.5"
libc = "0.2.172"
log-instrument = { path = "../log-instrument", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
vm-memory = { version = "0.16.1", features = ["backend-mmap", "backend-bitmap"] }
vmm-sys-util = "0.13.0"

[dev-dependencies]
serde_json = "1.0.140"

[features]
tracing = ["log-instrument"]

[lints]
workspace = true
